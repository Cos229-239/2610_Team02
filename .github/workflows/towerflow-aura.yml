name: Towerflow In-World AURA
on:
  pull_request:
    paths:
      - 'integrations/aura/**'
      - 'integrations/frontier/**'
      - 'integrations/mediator/**'
      - 'integrations/world/**'
      - 'tools/install-shared-world-from-git*'
      - 'tools/install-frontier-lobby.mjs'
      - 'tools/install-frontier-lobby.test.mjs'
      - 'tools/install-aura-world-emulation.mjs'
      - 'tools/install-aura-world-emulation.test.mjs'
      - 'towerflow-knowledge/object-reference-vault.json'
      - 'tools/install-aura-lighting.mjs'
      - 'tools/install-aura-lighting.test.mjs'
      - 'tools/install-towerflow-aura-from-git.mjs'
      - 'tools/install-towerflow-aura-from-git.test.mjs'
      - 'tools/install-aura-room-ui.mjs'
      - 'tools/install-aura-room-ui.test.mjs'
      - '.github/workflows/towerflow-aura.yml'
  push:
    branches: [dev]
    paths:
      - 'integrations/aura/**'
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check integrations/aura/aura-world-emulator.js
      - run: node --check tools/install-aura-world-emulation.mjs
      - run: node --check integrations/world/world-state.cjs
      - run: node --check integrations/world/world-sync-client.js
      - run: node --check tools/install-shared-world-from-git.mjs
      - run: node --check integrations/mediator/configuration-mediator.cjs
      - run: node --check integrations/frontier/frontier-lobby.js
      - run: node --check tools/install-frontier-lobby.mjs
      - run: node --check integrations/aura/aura-service.cjs
      - run: node --check tools/install-aura-lighting.mjs
      - run: node --check integrations/aura/aura-lighting-actions.js
      - run: node --check tools/install-towerflow-aura-from-git.mjs
      - run: node --check tools/install-aura-room-ui.mjs
      - run: node --test integrations/world/world-state.test.cjs tools/install-shared-world-from-git.test.mjs integrations/mediator/configuration-mediator.test.cjs integrations/mediator/environment-profiles.test.cjs integrations/aura/aura-service.test.cjs tools/install-aura-room-ui.test.mjs tools/install-towerflow-aura-from-git.test.mjs tools/install-aura-lighting.test.mjs tools/install-frontier-lobby.test.mjs tools/install-aura-world-emulation.test.mjs
